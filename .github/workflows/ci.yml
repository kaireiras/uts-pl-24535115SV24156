name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Pengujian Backend (Laravel)
  # -------------------------------------------------------------
  test-backend:
    name: Backend Test (Laravel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Copy .env
        working-directory: ./backend
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        working-directory: ./backend
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      # Menggunakan APP_KEY dan DB_PASSWORD dari GitHub Secrets
      - name: Execute Feature & Unit Tests
        working-directory: ./backend
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

  # -------------------------------------------------------------
  # Job 2: Build Frontend (Vue)
  # -------------------------------------------------------------
  build-frontend:
    name: Frontend Build (Vue)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Application
        working-directory: ./frontend
        run: npm run build

  # -------------------------------------------------------------
  # Job 3: Deploy to GitHub Container Registry (ghcr.io)
  # -------------------------------------------------------------
  deploy:
    name: Deploy Container Images
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    # Hanya berjalan saat push/merge ke branch main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Mengubah nama repo ke lowercase (ghcr.io menolak nama image berhuruf kapital)
      - name: Lowercase Repository Name
        id: repo-name
        run: echo "IMAGE_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & Push Docker Image Backend (Tag commit SHA)
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.IMAGE_REPO }}/backend:${{ github.sha }}

      # Build & Push Docker Image Frontend (Tag commit SHA)
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ env.IMAGE_REPO }}/frontend:${{ github.sha }}